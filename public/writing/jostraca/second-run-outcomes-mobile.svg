<svg class="jostraca-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 738" role="img" aria-labelledby="outcomes-phone-title outcomes-phone-desc">
<title id="outcomes-phone-title">What happens to the hand edit?</title><desc id="outcomes-phone-desc">Each path begins with a hand-edited file. Default settings overwrite it. Merge on the same machine keeps it. A fresh clone without the baseline overwrites it.</desc>
<style>
.jostraca-svg { --svg-bg:#f6f4ef; --svg-ink:#1c1b19; --svg-muted:#5c574f; --svg-node:#eeebe4; --svg-line:#8a8275; --svg-good:#e3ebe0; --svg-good-ink:#315b39; --svg-risk:#efe4dc; --svg-risk-ink:#704937; background:var(--background,var(--svg-bg)); font-family:var(--font-geist-sans,system-ui,sans-serif); }
@media(prefers-color-scheme:dark) { .jostraca-svg { --svg-bg:#121110; --svg-ink:#eceae4; --svg-muted:#a8a299; --svg-node:#1c1b19; --svg-line:#756d60; --svg-good:#1d2c21; --svg-good-ink:#b5ceb7; --svg-risk:#30251f; --svg-risk-ink:#d7b9a5; } }
.jostraca-svg .main { font-size:18px; font-weight:500; fill:var(--foreground,var(--svg-ink)); }
.jostraca-svg .secondary { font-size:15px; font-weight:400; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .phase { font-size:15px; font-weight:500; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .node rect,.jostraca-svg .node path { fill:var(--diagram-node,var(--svg-node)); stroke:var(--diagram-line,var(--svg-line)); stroke-width:1; stroke-linejoin:round; }
.jostraca-svg .good rect { fill:var(--diagram-good,var(--svg-good)); stroke:none; }
.jostraca-svg .good .main { fill:var(--diagram-good-ink,var(--svg-good-ink)); }
.jostraca-svg .risk rect { fill:var(--diagram-risk,var(--svg-risk)); stroke:none; }
.jostraca-svg .risk .main { fill:var(--diagram-risk-ink,var(--svg-risk-ink)); }
.jostraca-svg .connector { fill:none; stroke:var(--diagram-line,var(--svg-line)); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.jostraca-svg .arrow { fill:var(--diagram-line,var(--svg-line)); }
</style>
<defs><marker id="outcomes-phone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<text class="phase" x="150" y="22" text-anchor="middle"><tspan x="150" dy="0">Starting point: a hand-edited file</tspan></text><g class="node "><rect x="24" y="40" width="252" height="80" rx="9"/><text class="main" x="150" y="71" text-anchor="middle"><tspan x="150" dy="0">Default settings</tspan></text><text class="secondary" x="150" y="98" text-anchor="middle"><tspan x="150" dy="0">existing mode: write</tspan></text></g><path class="connector" d="M150 120 V138" marker-end="url(#outcomes-phone-arrow)"/><g class="node risk"><rect x="24" y="144" width="252" height="80" rx="9"/><text class="main" x="150" y="175" text-anchor="middle"><tspan x="150" dy="0">Edit overwritten</tspan></text><text class="secondary" x="150" y="202" text-anchor="middle"><tspan x="150" dy="0">written, exit 0</tspan></text></g><g class="node "><rect x="24" y="282" width="252" height="80" rx="9"/><text class="main" x="150" y="313" text-anchor="middle"><tspan x="150" dy="0">merge: true</tspan></text><text class="secondary" x="150" y="340" text-anchor="middle"><tspan x="150" dy="0">same machine</tspan></text></g><path class="connector" d="M150 362 V380" marker-end="url(#outcomes-phone-arrow)"/><g class="node good"><rect x="24" y="386" width="252" height="80" rx="9"/><text class="main" x="150" y="417" text-anchor="middle"><tspan x="150" dy="0">Edit kept</tspan></text><text class="secondary" x="150" y="444" text-anchor="middle"><tspan x="150" dy="0">three-way merge</tspan></text></g><g class="node "><rect x="24" y="524" width="252" height="80" rx="9"/><text class="main" x="150" y="555" text-anchor="middle"><tspan x="150" dy="0">merge: true</tspan></text><text class="secondary" x="150" y="582" text-anchor="middle"><tspan x="150" dy="0">fresh clone, no baseline</tspan></text></g><path class="connector" d="M150 604 V622" marker-end="url(#outcomes-phone-arrow)"/><g class="node risk"><rect x="24" y="628" width="252" height="80" rx="9"/><text class="main" x="150" y="659" text-anchor="middle"><tspan x="150" dy="0">Edit overwritten</tspan></text><text class="secondary" x="150" y="686" text-anchor="middle"><tspan x="150" dy="0">written, exit 0</tspan></text></g>
</svg>
