<svg class="jostraca-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 370" role="img" aria-labelledby="outcomes-wide-title outcomes-wide-desc">
<title id="outcomes-wide-title">What happens to the hand edit?</title><desc id="outcomes-wide-desc">The default overwrites the edit. Merge keeps it on the same machine. A fresh clone without the baseline overwrites it.</desc>
<style>
.jostraca-svg { --svg-bg:#f6f4ef; --svg-ink:#1c1b19; --svg-muted:#5c574f; --svg-node:#eeebe4; --svg-line:#8a8275; --svg-good:#e3ebe0; --svg-good-ink:#315b39; --svg-risk:#efe4dc; --svg-risk-ink:#704937; background:var(--background,var(--svg-bg)); font-family:var(--font-geist-sans,system-ui,sans-serif); }
@media(prefers-color-scheme:dark) { .jostraca-svg { --svg-bg:#121110; --svg-ink:#eceae4; --svg-muted:#a8a299; --svg-node:#1c1b19; --svg-line:#756d60; --svg-good:#1d2c21; --svg-good-ink:#b5ceb7; --svg-risk:#30251f; --svg-risk-ink:#d7b9a5; } }
.jostraca-svg .main { font-size:18px; font-weight:500; fill:var(--foreground,var(--svg-ink)); }
.jostraca-svg .secondary { font-size:15px; font-weight:400; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .phase { font-size:15px; font-weight:500; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .node rect,.jostraca-svg .node path { fill:var(--diagram-node,var(--svg-node)); stroke:var(--diagram-line,var(--svg-line)); stroke-width:1; stroke-linejoin:round; }
.jostraca-svg .good rect { fill:var(--diagram-good,var(--svg-good)); stroke:none; }
.jostraca-svg .good .main { fill:var(--diagram-good-ink,var(--svg-good-ink)); }
.jostraca-svg .risk rect { fill:var(--diagram-risk,var(--svg-risk)); stroke:none; }
.jostraca-svg .risk .main { fill:var(--diagram-risk-ink,var(--svg-risk-ink)); }
.jostraca-svg .connector { fill:none; stroke:var(--diagram-line,var(--svg-line)); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.jostraca-svg .arrow { fill:var(--diagram-line,var(--svg-line)); }
</style>
<defs><marker id="outcomes-wide-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<g class="node "><rect x="6" y="135" width="144" height="100" rx="9"/><text class="main" x="78" y="179.5" text-anchor="middle"><tspan x="78" dy="0">Hand-edited</tspan><tspan x="78" dy="23">file</tspan></text></g><g class="node "><rect x="208" y="12" width="210" height="100" rx="9"/><text class="main" x="313" y="43" text-anchor="middle"><tspan x="313" dy="0">Default settings</tspan></text><text class="secondary" x="313" y="90" text-anchor="middle"><tspan x="313" dy="0">existing mode: write</tspan></text></g><g class="node "><rect x="208" y="135" width="210" height="100" rx="9"/><text class="main" x="313" y="166" text-anchor="middle"><tspan x="313" dy="0">merge: true</tspan></text><text class="secondary" x="313" y="213" text-anchor="middle"><tspan x="313" dy="0">same machine</tspan></text></g><g class="node "><rect x="208" y="258" width="210" height="100" rx="9"/><text class="main" x="313" y="289" text-anchor="middle"><tspan x="313" dy="0">merge: true</tspan></text><text class="secondary" x="313" y="336" text-anchor="middle"><tspan x="313" dy="0">fresh clone, no baseline</tspan></text></g><g class="node risk"><rect x="470" y="12" width="244" height="100" rx="9"/><text class="main" x="592" y="43" text-anchor="middle"><tspan x="592" dy="0">Edit overwritten</tspan></text><text class="secondary" x="592" y="70" text-anchor="middle"><tspan x="592" dy="0">reported as written</tspan><tspan x="592" dy="23">exit 0</tspan></text></g><g class="node good"><rect x="470" y="135" width="244" height="100" rx="9"/><text class="main" x="592" y="166" text-anchor="middle"><tspan x="592" dy="0">Edit kept</tspan></text><text class="secondary" x="592" y="213" text-anchor="middle"><tspan x="592" dy="0">three-way merge</tspan></text></g><g class="node risk"><rect x="470" y="258" width="244" height="100" rx="9"/><text class="main" x="592" y="289" text-anchor="middle"><tspan x="592" dy="0">Edit overwritten</tspan></text><text class="secondary" x="592" y="316" text-anchor="middle"><tspan x="592" dy="0">reported as written</tspan><tspan x="592" dy="23">exit 0</tspan></text></g><path class="connector" d="M150 185 H174 V62 H202" marker-end="url(#outcomes-wide-arrow)"/><path class="connector" d="M150 185 H202" marker-end="url(#outcomes-wide-arrow)"/><path class="connector" d="M174 185 V308 H202" marker-end="url(#outcomes-wide-arrow)"/><path class="connector" d="M418 62 H464" marker-end="url(#outcomes-wide-arrow)"/><path class="connector" d="M418 185 H464" marker-end="url(#outcomes-wide-arrow)"/><path class="connector" d="M418 308 H464" marker-end="url(#outcomes-wide-arrow)"/>
</svg>
