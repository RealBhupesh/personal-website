<svg class="jostraca-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 702" role="img" aria-labelledby="proposal-phone-title proposal-phone-desc">
<title id="proposal-phone-title">A check before any overwrite</title><desc id="proposal-phone-desc">Write new files. For existing files, compare with the baseline. Apply the chosen mode only if unchanged; otherwise skip and report edited, exiting one.</desc>
<style>
.jostraca-svg { --svg-bg:#f6f4ef; --svg-ink:#1c1b19; --svg-muted:#5c574f; --svg-node:#eeebe4; --svg-line:#8a8275; --svg-good:#e3ebe0; --svg-good-ink:#315b39; --svg-risk:#efe4dc; --svg-risk-ink:#704937; background:var(--background,var(--svg-bg)); font-family:var(--font-geist-sans,system-ui,sans-serif); }
@media(prefers-color-scheme:dark) { .jostraca-svg { --svg-bg:#121110; --svg-ink:#eceae4; --svg-muted:#a8a299; --svg-node:#1c1b19; --svg-line:#756d60; --svg-good:#1d2c21; --svg-good-ink:#b5ceb7; --svg-risk:#30251f; --svg-risk-ink:#d7b9a5; } }
.jostraca-svg .main { font-size:18px; font-weight:500; fill:var(--foreground,var(--svg-ink)); }
.jostraca-svg .secondary { font-size:15px; font-weight:400; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .phase { font-size:15px; font-weight:500; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .node rect,.jostraca-svg .node path { fill:var(--diagram-node,var(--svg-node)); stroke:var(--diagram-line,var(--svg-line)); stroke-width:1; stroke-linejoin:round; }
.jostraca-svg .good rect { fill:var(--diagram-good,var(--svg-good)); stroke:none; }
.jostraca-svg .good .main { fill:var(--diagram-good-ink,var(--svg-good-ink)); }
.jostraca-svg .risk rect { fill:var(--diagram-risk,var(--svg-risk)); stroke:none; }
.jostraca-svg .risk .main { fill:var(--diagram-risk-ink,var(--svg-risk-ink)); }
.jostraca-svg .connector { fill:none; stroke:var(--diagram-line,var(--svg-line)); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.jostraca-svg .arrow { fill:var(--diagram-line,var(--svg-line)); }
</style>
<defs><marker id="proposal-phone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<g class="node "><rect x="24" y="10" width="252" height="66" rx="9"/><text class="main" x="150" y="49" text-anchor="middle"><tspan x="150" dy="0">Generated file</tspan></text></g><path class="connector" d="M150 76 V102" marker-end="url(#proposal-phone-arrow)"/><g class="node"><path d="M150 110 L227 153 L150 196 L73 153Z"/><text class="main" x="150" y="159" text-anchor="middle"><tspan x="150" dy="0">On disk?</tspan></text></g><path class="connector" d="M150 196 V253" marker-end="url(#proposal-phone-arrow)"/><text class="secondary" x="171" y="223" text-anchor="middle"><tspan x="171" dy="0">no</tspan></text><g class="node "><rect x="24" y="260" width="252" height="65" rx="9"/><text class="main" x="150" y="298.5" text-anchor="middle"><tspan x="150" dy="0">Write the file</tspan></text></g><path class="connector" d="M227 153 H283 V362 H150 V383" marker-end="url(#proposal-phone-arrow)"/><text class="secondary" x="265" y="141" text-anchor="middle"><tspan x="265" dy="0">yes</tspan></text><g class="node"><path d="M150 390 L239 433 L150 476 L61 433Z"/><text class="main" x="150" y="439" text-anchor="middle"><tspan x="150" dy="0">Unchanged?</tspan></text></g><path class="connector" d="M150 476 V500" marker-end="url(#proposal-phone-arrow)"/><text class="secondary" x="174" y="498" text-anchor="middle"><tspan x="174" dy="0">yes</tspan></text><g class="node "><rect x="24" y="510" width="252" height="65" rx="9"/><text class="main" x="150" y="548.5" text-anchor="middle"><tspan x="150" dy="0">Apply chosen mode</tspan></text></g><path class="connector" d="M61 433 H10 V622 H20" marker-end="url(#proposal-phone-arrow)"/><text class="secondary" x="31" y="460" text-anchor="middle"><tspan x="31" dy="0">no</tspan></text><g class="node risk"><rect x="24" y="585" width="252" height="95" rx="9"/><text class="main" x="150" y="616" text-anchor="middle"><tspan x="150" dy="0">Edited by a person</tspan></text><text class="secondary" x="150" y="638" text-anchor="middle"><tspan x="150" dy="0">skip · report edited</tspan><tspan x="150" dy="23">exit 1</tspan></text></g>
</svg>
