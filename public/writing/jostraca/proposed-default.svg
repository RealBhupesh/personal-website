<svg class="jostraca-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="proposal-wide-title proposal-wide-desc">
<title id="proposal-wide-title">A check before any overwrite</title><desc id="proposal-wide-desc">New files are written. Existing files are compared with the baseline: unchanged files use the chosen mode; edited files are skipped and reported with exit one.</desc>
<style>
.jostraca-svg { --svg-bg:#f6f4ef; --svg-ink:#1c1b19; --svg-muted:#5c574f; --svg-node:#eeebe4; --svg-line:#8a8275; --svg-good:#e3ebe0; --svg-good-ink:#315b39; --svg-risk:#efe4dc; --svg-risk-ink:#704937; background:var(--background,var(--svg-bg)); font-family:var(--font-geist-sans,system-ui,sans-serif); }
@media(prefers-color-scheme:dark) { .jostraca-svg { --svg-bg:#121110; --svg-ink:#eceae4; --svg-muted:#a8a299; --svg-node:#1c1b19; --svg-line:#756d60; --svg-good:#1d2c21; --svg-good-ink:#b5ceb7; --svg-risk:#30251f; --svg-risk-ink:#d7b9a5; } }
.jostraca-svg .main { font-size:18px; font-weight:500; fill:var(--foreground,var(--svg-ink)); }
.jostraca-svg .secondary { font-size:15px; font-weight:400; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .phase { font-size:15px; font-weight:500; fill:var(--muted,var(--svg-muted)); }
.jostraca-svg .node rect,.jostraca-svg .node path { fill:var(--diagram-node,var(--svg-node)); stroke:var(--diagram-line,var(--svg-line)); stroke-width:1; stroke-linejoin:round; }
.jostraca-svg .good rect { fill:var(--diagram-good,var(--svg-good)); stroke:none; }
.jostraca-svg .good .main { fill:var(--diagram-good-ink,var(--svg-good-ink)); }
.jostraca-svg .risk rect { fill:var(--diagram-risk,var(--svg-risk)); stroke:none; }
.jostraca-svg .risk .main { fill:var(--diagram-risk-ink,var(--svg-risk-ink)); }
.jostraca-svg .connector { fill:none; stroke:var(--diagram-line,var(--svg-line)); stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; }
.jostraca-svg .arrow { fill:var(--diagram-line,var(--svg-line)); }
</style>
<defs><marker id="proposal-wide-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="arrow" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<g class="node "><rect x="4" y="36" width="154" height="90" rx="9"/><text class="main" x="81" y="87" text-anchor="middle"><tspan x="81" dy="0">Generated file</tspan></text></g><g class="node"><path d="M271 32 L349 82 L271 132 L193 82Z"/><text class="main" x="271" y="88" text-anchor="middle"><tspan x="271" dy="0">On disk?</tspan></text></g><g class="node"><path d="M467 32 L545 82 L467 132 L389 82Z"/><text class="main" x="467" y="88" text-anchor="middle"><tspan x="467" dy="0">Unchanged?</tspan></text></g><g class="node "><rect x="580" y="36" width="136" height="90" rx="9"/><text class="main" x="648" y="75.5" text-anchor="middle"><tspan x="648" dy="0">Apply chosen</tspan><tspan x="648" dy="23">mode</tspan></text></g><g class="node "><rect x="183" y="205" width="176" height="80" rx="9"/><text class="main" x="271" y="251" text-anchor="middle"><tspan x="271" dy="0">Write the file</tspan></text></g><g class="node risk"><rect x="410" y="205" width="282" height="80" rx="9"/><text class="main" x="551" y="236" text-anchor="middle"><tspan x="551" dy="0">Edited by a person</tspan></text><text class="secondary" x="551" y="263" text-anchor="middle"><tspan x="551" dy="0">skip · report edited · exit 1</tspan></text></g><path class="connector" d="M158 81 H187" marker-end="url(#proposal-wide-arrow)"/><path class="connector" d="M349 82 H383" marker-end="url(#proposal-wide-arrow)"/><text class="secondary" x="369" y="67" text-anchor="middle"><tspan x="369" dy="0">yes</tspan></text><path class="connector" d="M545 82 H574" marker-end="url(#proposal-wide-arrow)"/><text class="secondary" x="564" y="67" text-anchor="middle"><tspan x="564" dy="0">yes</tspan></text><path class="connector" d="M271 132 V198" marker-end="url(#proposal-wide-arrow)"/><text class="secondary" x="291" y="174" text-anchor="middle"><tspan x="291" dy="0">no</tspan></text><path class="connector" d="M467 132 V174 H551 V198" marker-end="url(#proposal-wide-arrow)"/><text class="secondary" x="487" y="154" text-anchor="middle"><tspan x="487" dy="0">no</tspan></text>
</svg>
