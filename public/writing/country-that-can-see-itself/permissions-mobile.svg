<svg xmlns="http://www.w3.org/2000/svg" class="economic-svg" viewBox="0 0 320 708" role="img" aria-labelledby="econ-permissions-phone-title econ-permissions-phone-desc">
<title id="econ-permissions-phone-title">Three purposes, three permission checks</title><desc id="econ-permissions-phone-desc">Three separate access paths: source totals pass disclosure controls to a public index; a borrower authorises scoped, expiring access for a named lender; case records pass an authority and audit check before a human reviewer sees them.</desc>
<style>
.economic-svg{--e-bg:#f6f4ef;--e-ink:#1c1b19;--e-muted:#5c574f;--e-line:#857d71;--e-node:#eeebe4;--e-good:#315b39;--e-good-bg:#e3ebe0;background:var(--background,var(--e-bg));font-family:var(--font-geist-sans,system-ui,sans-serif)}
@media(prefers-color-scheme:dark){.economic-svg{--e-bg:#121110;--e-ink:#eceae4;--e-muted:#a8a299;--e-line:#938a7c;--e-node:#1c1b19;--e-good:#b5ceb7;--e-good-bg:#1d2c21}}
.economic-svg .label{font-size:18px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .small{font-size:15px;font-weight:400;fill:var(--muted,var(--e-muted))}
.economic-svg .section{font-size:17px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .node rect{fill:var(--diagram-node,var(--e-node));stroke:var(--diagram-line,var(--e-line));stroke-width:1.25}
.economic-svg .node.output rect{fill:var(--diagram-good,var(--e-good-bg))}
.economic-svg .node.output .label{fill:var(--diagram-good-ink,var(--e-good))}
.economic-svg .edge{fill:none;stroke:var(--diagram-line,var(--e-line));stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.economic-svg .edge.unmatched{stroke-dasharray:5 5}
.economic-svg .arrow-tip{fill:var(--diagram-line,var(--e-line))}
.economic-svg .label-gap{fill:var(--background,var(--e-bg))}
</style>
<defs><marker id="econ-permissions-phone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-tip" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<text class="section" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="20">Public statistics</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="55">Totals computed at source</tspan></text><path class="edge " d="M160 71 V91" marker-end="url(#econ-permissions-phone-arrow)"/><g class="node "><rect x="30" y="97" width="260" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="116">Aggregate + protect</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="142">group sizes · query controls</tspan></text></g><path class="edge " d="M160 159 V179" marker-end="url(#econ-permissions-phone-arrow)"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="197">Public index</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="221">no personal records</tspan></text><text class="section" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="250">A loan application</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="285">Borrower’s records at provider</tspan></text><path class="edge " d="M160 301 V321" marker-end="url(#econ-permissions-phone-arrow)"/><g class="node "><rect x="30" y="327" width="260" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="346">Consent check</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="372">purpose · scope · expiry</tspan></text></g><path class="edge " d="M160 389 V409" marker-end="url(#econ-permissions-phone-arrow)"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="427">Named lender</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="451">bounded data use</tspan></text><text class="section" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="480">An investigation</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="515">Specific case records</tspan></text><path class="edge " d="M160 531 V551" marker-end="url(#econ-permissions-phone-arrow)"/><g class="node "><rect x="30" y="557" width="260" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="576">Authority + audit log</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="602">case-specific permissions</tspan></text></g><path class="edge " d="M160 619 V639" marker-end="url(#econ-permissions-phone-arrow)"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="657">Human reviewer</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="681">evidence + correction</tspan></text>
</svg>
