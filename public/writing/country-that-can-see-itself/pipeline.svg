<svg xmlns="http://www.w3.org/2000/svg" class="economic-svg" viewBox="0 0 792 310" role="img" aria-labelledby="econ-pipeline-wide-title econ-pipeline-wide-desc">
<title id="econ-pipeline-wide-title">From events to an estimate</title><desc id="econ-pipeline-wide-desc">UPI payments, GST e-way bills and FASTag crossings enter a cleaning and time-alignment stage. Weekly features feed a nowcast with uncertainty. Estimates are checked against surveys and published statistics.</desc>
<style>
.economic-svg{--e-bg:#f6f4ef;--e-ink:#1c1b19;--e-muted:#5c574f;--e-line:#857d71;--e-node:#eeebe4;--e-good:#315b39;--e-good-bg:#e3ebe0;background:var(--background,var(--e-bg));font-family:var(--font-geist-sans,system-ui,sans-serif)}
@media(prefers-color-scheme:dark){.economic-svg{--e-bg:#121110;--e-ink:#eceae4;--e-muted:#a8a299;--e-line:#938a7c;--e-node:#1c1b19;--e-good:#b5ceb7;--e-good-bg:#1d2c21}}
.economic-svg .label{font-size:18px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .small{font-size:15px;font-weight:400;fill:var(--muted,var(--e-muted))}
.economic-svg .section{font-size:17px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .node rect{fill:var(--diagram-node,var(--e-node));stroke:var(--diagram-line,var(--e-line));stroke-width:1.25}
.economic-svg .node.output rect{fill:var(--diagram-good,var(--e-good-bg))}
.economic-svg .node.output .label{fill:var(--diagram-good-ink,var(--e-good))}
.economic-svg .edge{fill:none;stroke:var(--diagram-line,var(--e-line));stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.economic-svg .edge.unmatched{stroke-dasharray:5 5}
.economic-svg .arrow-tip{fill:var(--diagram-line,var(--e-line))}
.economic-svg .label-gap{fill:var(--background,var(--e-bg))}
</style>
<defs><marker id="econ-pipeline-wide-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-tip" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<g class="node "><rect x="12" y="24" width="142" height="44" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="83" y="46">UPI payments</tspan></text></g><g class="node "><rect x="12" y="110" width="142" height="44" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="83" y="132">GST e-way bills</tspan></text></g><g class="node "><rect x="12" y="196" width="142" height="44" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="83" y="218">FASTag passes</tspan></text></g><g class="node "><rect x="206" y="86" width="150" height="92" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="281" y="111">Clean + align</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="281" y="137">dedupe · reversals</tspan><tspan x="281" y="155">event vs arrival time</tspan></text></g><g class="node "><rect x="412" y="86" width="150" height="92" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="487" y="111">Weekly features</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="487" y="137">region · week</tspan><tspan x="487" y="155">coverage recorded</tspan></text></g><g class="node output"><rect x="618" y="86" width="160" height="92" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="698" y="120">Nowcast</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="698" y="146">estimate + range</tspan></text></g><path class="edge" d="M154 46 H178 V218 H154"/><path class="edge " d="M154 132 H200" marker-end="url(#econ-pipeline-wide-arrow)"/><path class="edge " d="M356 132 H406" marker-end="url(#econ-pipeline-wide-arrow)"/><path class="edge " d="M562 132 H612" marker-end="url(#econ-pipeline-wide-arrow)"/><g class="node "><rect x="412" y="238" width="366" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="595" y="257">Validate against benchmarks</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="595" y="283">surveys + published statistics</tspan></text></g><path class="edge " d="M698 178 V210 H595 V232" marker-end="url(#econ-pipeline-wide-arrow)"/>
</svg>
