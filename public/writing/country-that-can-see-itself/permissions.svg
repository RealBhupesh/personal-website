<svg xmlns="http://www.w3.org/2000/svg" class="economic-svg" viewBox="0 0 792 360" role="img" aria-labelledby="econ-permissions-wide-title econ-permissions-wide-desc">
<title id="econ-permissions-wide-title">Three purposes, three permission checks</title><desc id="econ-permissions-wide-desc">Three separate access paths: source totals pass disclosure controls to a public index; a borrower authorises scoped, expiring access for a named lender; case records pass an authority and audit check before a human reviewer sees them.</desc>
<style>
.economic-svg{--e-bg:#f6f4ef;--e-ink:#1c1b19;--e-muted:#5c574f;--e-line:#857d71;--e-node:#eeebe4;--e-good:#315b39;--e-good-bg:#e3ebe0;background:var(--background,var(--e-bg));font-family:var(--font-geist-sans,system-ui,sans-serif)}
@media(prefers-color-scheme:dark){.economic-svg{--e-bg:#121110;--e-ink:#eceae4;--e-muted:#a8a299;--e-line:#938a7c;--e-node:#1c1b19;--e-good:#b5ceb7;--e-good-bg:#1d2c21}}
.economic-svg .label{font-size:18px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .small{font-size:15px;font-weight:400;fill:var(--muted,var(--e-muted))}
.economic-svg .section{font-size:17px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .node rect{fill:var(--diagram-node,var(--e-node));stroke:var(--diagram-line,var(--e-line));stroke-width:1.25}
.economic-svg .node.output rect{fill:var(--diagram-good,var(--e-good-bg))}
.economic-svg .node.output .label{fill:var(--diagram-good-ink,var(--e-good))}
.economic-svg .edge{fill:none;stroke:var(--diagram-line,var(--e-line));stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.economic-svg .edge.unmatched{stroke-dasharray:5 5}
.economic-svg .arrow-tip{fill:var(--diagram-line,var(--e-line))}
.economic-svg .label-gap{fill:var(--background,var(--e-bg))}
</style>
<defs><marker id="econ-permissions-wide-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-tip" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<text class="section" text-anchor="middle" dominant-baseline="central"><tspan x="130" y="15">Public statistics</tspan></text><g class="node "><rect x="12" y="32" width="194" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="109" y="56">Source totals</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="109" y="82">computed at source</tspan></text></g><g class="node "><rect x="276" y="32" width="230" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="391" y="56">Aggregate + protect</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="391" y="82">group sizes · query controls</tspan></text></g><g class="node output"><rect x="576" y="32" width="204" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="678" y="56">Public index</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="678" y="82">no personal records</tspan></text></g><path class="edge " d="M206 68 H270" marker-end="url(#econ-permissions-wide-arrow)"/><path class="edge " d="M506 68 H570" marker-end="url(#econ-permissions-wide-arrow)"/><text class="section" text-anchor="middle" dominant-baseline="central"><tspan x="130" y="135">A loan application</tspan></text><g class="node "><rect x="12" y="152" width="194" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="109" y="176">Borrower’s records</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="109" y="202">at the source provider</tspan></text></g><g class="node "><rect x="276" y="152" width="230" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="391" y="176">Consent check</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="391" y="202">purpose · scope · expiry</tspan></text></g><g class="node "><rect x="576" y="152" width="204" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="678" y="176">Named lender</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="678" y="202">bounded data use</tspan></text></g><path class="edge " d="M206 188 H270" marker-end="url(#econ-permissions-wide-arrow)"/><path class="edge " d="M506 188 H570" marker-end="url(#econ-permissions-wide-arrow)"/><text class="section" text-anchor="middle" dominant-baseline="central"><tspan x="130" y="255">An investigation</tspan></text><g class="node "><rect x="12" y="272" width="194" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="109" y="296">Specific case records</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="109" y="322">authorised scope only</tspan></text></g><g class="node "><rect x="276" y="272" width="230" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="391" y="296">Authority + audit log</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="391" y="322">case-specific permissions</tspan></text></g><g class="node "><rect x="576" y="272" width="204" height="72" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="678" y="296">Human reviewer</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="678" y="322">evidence + correction</tspan></text></g><path class="edge " d="M206 308 H270" marker-end="url(#econ-permissions-wide-arrow)"/><path class="edge " d="M506 308 H570" marker-end="url(#econ-permissions-wide-arrow)"/>
</svg>
