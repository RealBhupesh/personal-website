<svg xmlns="http://www.w3.org/2000/svg" class="economic-svg" viewBox="0 0 320 562" role="img" aria-labelledby="econ-pipeline-phone-title econ-pipeline-phone-desc">
<title id="econ-pipeline-phone-title">From events to an estimate</title><desc id="econ-pipeline-phone-desc">UPI payments, GST e-way bills and FASTag crossings enter a cleaning and time-alignment stage. Weekly features feed a nowcast with uncertainty. Estimates are checked against surveys and published statistics.</desc>
<style>
.economic-svg{--e-bg:#f6f4ef;--e-ink:#1c1b19;--e-muted:#5c574f;--e-line:#857d71;--e-node:#eeebe4;--e-good:#315b39;--e-good-bg:#e3ebe0;background:var(--background,var(--e-bg));font-family:var(--font-geist-sans,system-ui,sans-serif)}
@media(prefers-color-scheme:dark){.economic-svg{--e-bg:#121110;--e-ink:#eceae4;--e-muted:#a8a299;--e-line:#938a7c;--e-node:#1c1b19;--e-good:#b5ceb7;--e-good-bg:#1d2c21}}
.economic-svg .label{font-size:18px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .small{font-size:15px;font-weight:400;fill:var(--muted,var(--e-muted))}
.economic-svg .section{font-size:17px;font-weight:500;fill:var(--foreground,var(--e-ink))}
.economic-svg .node rect{fill:var(--diagram-node,var(--e-node));stroke:var(--diagram-line,var(--e-line));stroke-width:1.25}
.economic-svg .node.output rect{fill:var(--diagram-good,var(--e-good-bg))}
.economic-svg .node.output .label{fill:var(--diagram-good-ink,var(--e-good))}
.economic-svg .edge{fill:none;stroke:var(--diagram-line,var(--e-line));stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.economic-svg .edge.unmatched{stroke-dasharray:5 5}
.economic-svg .arrow-tip{fill:var(--diagram-line,var(--e-line))}
.economic-svg .label-gap{fill:var(--background,var(--e-bg))}
</style>
<defs><marker id="econ-pipeline-phone-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path class="arrow-tip" d="M1 1 L7 4 L1 7Z"/></marker></defs>
<g class="node "><rect x="8" y="12" width="94" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="55" y="31">UPI</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="55" y="57">payments</tspan></text></g><g class="node "><rect x="113" y="12" width="94" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="31">GST</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="57">e-way bills</tspan></text></g><g class="node "><rect x="218" y="12" width="94" height="62" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="265" y="31">FASTag</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="265" y="57">crossings</tspan></text></g><path class="edge" d="M55 74 V96 H265 V74"/><path class="edge " d="M160 74 V116" marker-end="url(#econ-pipeline-phone-arrow)"/><g class="node "><rect x="30" y="122" width="260" height="76" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="148">Clean + align time</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="174">dedupe · reversals · late events</tspan></text></g><path class="edge " d="M160 198 V228" marker-end="url(#econ-pipeline-phone-arrow)"/><g class="node "><rect x="30" y="234" width="260" height="76" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="260">Weekly features</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="286">region · week · coverage</tspan></text></g><path class="edge " d="M160 310 V340" marker-end="url(#econ-pipeline-phone-arrow)"/><g class="node output"><rect x="30" y="346" width="260" height="76" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="372">Nowcast</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="398">estimate + uncertainty</tspan></text></g><path class="edge " d="M160 422 V452" marker-end="url(#econ-pipeline-phone-arrow)"/><g class="node "><rect x="30" y="458" width="260" height="80" rx="3"/><text class="label" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="486">Check against benchmarks</tspan></text><text class="small" text-anchor="middle" dominant-baseline="central"><tspan x="160" y="512">surveys + published statistics</tspan></text></g>
</svg>
